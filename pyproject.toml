[project]
name = "jubensha-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "langgraph>=0.6,<2",
    "streamlit>=1.40,<2",
    "litellm>=1.70,<2",
    "python-docx>=1.2.0",
    "pypdf>=6.21.4",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.33",
    "json-repair>=0.64.2",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jubensha"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
