[project]
name = "jubensha-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "langgraph>=0.6,<2", "streamlit>=1.40,<2", "litellm>=1.70,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jubensha"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
